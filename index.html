                  <div key={idx} className="p-4 rounded-xl border bg-slate-50 dark:bg-slate-800 space-y-2">
                    <p className="font-bold text-slate-900 dark:text-white">Q{idx + 1}. {q.question}</p>
                    <div className="space-y-1">
                      {q.options.map((opt, oIdx) => (
                        <div key={oIdx} className="p-2 rounded-lg border bg-white dark:bg-slate-900 flex justify-between">
                          <span>{opt}</span>
                          {oIdx === q.correctAnswer && <span className="font-bold text-emerald-600">Correct Answer</span>}
                        </div>
                      ))}
                    </div>
                    {q.explanation && (
                      <p className="text-[11px] text-slate-500 pt-1"><strong>Explanation:</strong> {q.explanation}</p>
                    )}
                  </div>
                ))}
                <div className="flex justify-end pt-2">
                  <button onClick={() => { setActiveAssessment(null); showToast('Assessment completed! 100% Score (+150 XP)!'); }} className="px-6 py-2.5 rounded-xl bg-emerald-600 text-white font-bold shadow">
                    Submit & Finish Exam
                  </button>
                </div>
              </div>
            )}
          </Modal>

          {/* Toast */}
          <Toast message={toast.message} type={toast.type} onClose={() => setToast({ message: '', type: 'success' })} />
        </div>
      );
    }

    // Mount to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
